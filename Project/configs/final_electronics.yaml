dataset:
  name: Amazon Electronics
  ratings_path: data/ratings_Electronics.csv
  k_core: 10

protocol:
  rating_filter: 3.0
  test_ratio: 0.20
  val_ratio_within_train: 0.125
  top_k: 20
  relevance_threshold: 3.0
  epochs: 50
  patience: 5
  early_stop_metric: NDCG@20
  force_retrain: false

grid_search:
  enabled: false
  max_trials_per_model: 10
  selection_metric: NDCG@20

models:
  two_tower_bpr:
    embedding_dim: 64
    hidden_dims: [128, 64]
    lr: 0.001
    batch_size: 1024
    reg_weight: 0.0001
  lightgcn_bpr:
    embedding_dim: 64
    n_layers: 3
    lr: 0.001
    batch_size: 1024
    reg_weight: 0.0001
  lightgcl:
    embedding_dim: 64
    n_layers: 2
    svd_rank: 5
    dropout: 0.0
    lr: 0.001
    batch_size: 2048
    tau: 0.5
    lam_cl: 0.2
    lam_reg: 0.0000001
  gatv2:
    embedding_dim: 64
    n_layers: 2
    n_heads: 4
    dropout: 0.0
    lr: 0.001
    batch_size: 1024
    l2_reg: 0.0001
  graphsage:
    embedding_dim: 256
    hidden_dim: 256
    n_layers: 2
    dropout: 0.2
    lr: 0.001
    batch_size: 1024
    reg_weight: 0.00001
  svd_graph_fusion:
    latent_dim: 64
    lr: 0.0003
    batch_size: 1024
    reg_weight: 0.0001
    variants:
      - name: top10_w020
        top_k_global: 10
        global_weight_scale: 0.20
