dataset:
  name: Amazon Electronics
  ratings_path: data/ratings_Electronics.csv
  k_core: 10

protocol:
  rating_filter: 3.0
  test_ratio: 0.20
  val_ratio_within_train: 0.125
  top_k: 20
  relevance_threshold: 3.0
  epochs: 100
  patience: 10
  early_stop_metric: NDCG@20
  force_retrain: true

grid_search:
  enabled: false
  max_trials_per_model: 10
  selection_metric: NDCG@20

models:
  two_tower_bpr:
    name: emb128_h256-128_lr1e-3_reg1e-4
    embedding_dim: 128
    hidden_dims: [256, 128]
    lr: 0.001
    batch_size: 1024
    reg_weight: 0.0001
  lightgcn_bpr:
    name: emb128_l3_lr1e-3_reg1e-4
    embedding_dim: 128
    n_layers: 3
    lr: 0.001
    batch_size: 1024
    reg_weight: 0.0001
  lightgcl:
    name: elec_r100_cl002_lr5e-4
    embedding_dim: 64
    n_layers: 2
    svd_rank: 100
    dropout: 0.0
    lr: 0.0005
    batch_size: 2048
    tau: 0.5
    lam_cl: 0.02
    lam_reg: 0.0000001
  gatv2:
    name: emb128_l2_h2_lr5e-4_drop0
    embedding_dim: 128
    n_layers: 2
    n_heads: 2
    dropout: 0.0
    lr: 0.0005
    batch_size: 1024
    l2_reg: 0.0001
  graphsage:
    name: emb128_h128_l2_drop02_lr5e-4
    embedding_dim: 128
    hidden_dim: 128
    n_layers: 2
    dropout: 0.2
    lr: 0.0005
    batch_size: 1024
    reg_weight: 0.00001
  svd_graph_fusion:
    name: rank64_top10_w002_reg5e-4
    latent_dim: 64
    lr: 0.0003
    batch_size: 1024
    reg_weight: 0.0005
    variants:
      - name: rank64_top10_w002_reg5e-4
        top_k_global: 10
        global_weight_scale: 0.02
